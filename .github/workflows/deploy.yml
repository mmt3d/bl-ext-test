name: Deploy Blender Extension

on:
  push:
    branches:
      - main
    paths:
      - 'bl-ext-test/__init__.py'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout Distribution Repository
        uses: actions/checkout@v6
        with:
          repository: 'mmt3d/blender-extensions'
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Process Manifest and Build ZIP
        id: build_meta
        run: |
          python src/.github/scripts/update_index.py

      - name: Commit and Push to Central Repository
        run: |
          cd dist
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add zips/
          if ! git diff --cached --exit-code; then
            git commit -m "chore: Deploy addon from external repository"
            git push origin main
          else
            echo "変更はありませんでした。"
          fi
